  # ---------------------------------------------------------
  # JOB 3: Mirror (Runs ONLY on push to main branch)
  # ---------------------------------------------------------
  mirror:
    if: |
      github.repository == 'drixelone/marketing-site/' && 
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout Org Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false 

      - name: Push to Personal Bridge Repo
        env:
          PERSONAL_TOKEN: ${{ secrets.DRIXELONE_TOKEN }}
        run: |
          unset GITHUB_TOKEN
          git config --global user.email "tech@drixelone.com"
          git config --global user.name "drixel-one-bot"
          git remote add vercel_bridge https://drixelone-tech:${PERSONAL_TOKEN}@github.com/drixelone-tech/marketing-site-deploy.git || true
          git push vercel_bridge main --force
